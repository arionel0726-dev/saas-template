name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/app
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: ci-placeholder
      EMAIL_FROM: app <noreply@example.com>
      LEMONSQUEEZY_API_KEY: ci-placeholder
      LEMONSQUEEZY_STORE_ID: ci-placeholder
      LEMONSQUEEZY_PRO_VARIANT_ID: ci-placeholder
      LEMONSQUEEZY_WEBHOOK_SECRET: ci-placeholder
      CRON_SECRET: ci-placeholder
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
